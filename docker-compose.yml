version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: ecommerce-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ecommerce
      - STRAPI_URL=http://cms:1337
    depends_on:
      - postgres
    networks:
      - ecommerce-network

  frontend:
    build:
      context: ./frontend
    container_name: ecommerce-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ecommerce-network

  cms:
    build:
      context: ./cms
    container_name: ecommerce-cms
    ports:
      - "1337:1337"
    env_file:
      - ./cms/.env
    networks:
      - ecommerce-network

  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ecommerce-network

volumes:
  postgres-data:

networks:
  ecommerce-network:
    driver: bridge
